<div class="page-header">
  <h1>Late shipments</h1>
  <span class="subtitle">Sorted worst-first</span>
</div>

<div *ngIf="loading">Loading…</div>
<div *ngIf="error" class="error-banner">{{ error }}</div>

<div *ngIf="!loading && !error && shipments.length === 0" class="empty-state">
  Nothing is late right now.
</div>

<table *ngIf="!loading && shipments.length > 0">
  <thead>
    <tr>
      <th>Customer</th>
      <th>Destination</th>
      <th>Status</th>
      <th>Promised</th>
      <th>Days late</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let s of shipments" class="row-late">
      <td>{{ s.customerName }}</td>
      <td>{{ s.destination }}</td>
      <td>{{ s.status }}</td>
      <td>{{ s.promisedDate | date: "MMM d" }}</td>
      <td class="text-amber">{{ s.daysLate }}d</td>
      <td><a [routerLink]="['/shipments', s.id]">View →</a></td>
    </tr>
  </tbody>
</table>

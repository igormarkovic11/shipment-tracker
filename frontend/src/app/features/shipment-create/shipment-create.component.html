<a routerLink="/" class="back-link">← Back to shipments</a>

<h1>New shipment</h1>

<div *ngIf="loadingCustomers">Loading customers…</div>

<form *ngIf="!loadingCustomers" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label>Customer</label>
    <select formControlName="customerId">
      <option value="" disabled>Select customer</option>
      <option *ngFor="let c of customers" [value]="c.id">{{ c.name }}</option>
    </select>
  </div>

  <div class="field">
    <label>Destination</label>
    <input
      type="text"
      formControlName="destination"
      placeholder="e.g. Beograd"
    />
  </div>

  <div class="field">
    <label>Promised date</label>
    <input type="date" formControlName="promisedDate" />
  </div>

  <div *ngIf="error" class="error-banner">{{ error }}</div>

  <button type="submit" [disabled]="form.invalid || submitting">
    {{ submitting ? "Creating…" : "Create shipment" }}
  </button>
</form>
